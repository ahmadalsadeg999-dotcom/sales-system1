// ---------- سحب النوافذ (يشتغل تلقائياً على كل نوافذ النظام) ----------
let _previouslyOpenOverlays = new Set();

function applyWindowEntranceAnimation() {
  const current = new Set();
  document.querySelectorAll('[id$="-overlay"]').forEach(el => {
    current.add(el.id);
    if (!_previouslyOpenOverlays.has(el.id)) {
      // نافذة جديدة فعلاً (مو مجرد إعادة رسم بسبب الكتابة) — نطبّق حركة الدخول مرة وحدة
      el.style.animation = 'overlayIn 0.15s ease';
      const windowBox = el.firstElementChild;
      if (windowBox) windowBox.style.animation = 'windowIn 0.18s cubic-bezier(0.2,0.9,0.3,1)';
    }
  });
  _previouslyOpenOverlays = current;
}
function attachWindowDragging() {
  document.querySelectorAll('.win-title').forEach(titleEl => {
    const windowEl = titleEl.parentElement;
    const overlayEl = windowEl ? windowEl.parentElement : null;
    if (!windowEl || !overlayEl || !overlayEl.id || !overlayEl.id.endsWith('-overlay')) return;
    const key = overlayEl.id.replace(/-overlay$/, '');
    const applyPosition = (top, left) => {
      overlayEl.style.alignItems = 'flex-start';
      overlayEl.style.justifyContent = 'flex-start';
      windowEl.style.position = 'fixed';
      windowEl.style.margin = '0';
      windowEl.style.top = Math.max(0, Math.min(top, window.innerHeight - 60)) + 'px';
      windowEl.style.left = Math.max(0, Math.min(left, window.innerWidth - 80)) + 'px';
    };
    const saved = state.windowPositions[key];
    if (saved) applyPosition(saved.top, saved.left);
    titleEl.style.cursor = 'move';
    titleEl.title = 'اسحب لتحريك النافذة';
    const startDrag = (clientX, clientY) => {
      const rect = windowEl.getBoundingClientRect();
      const offsetX = clientX - rect.left;
      const offsetY = clientY - rect.top;
      const onMove = (mx, my) => applyPosition(my - offsetY, mx - offsetX);
      const onMouseMove = (ev) => onMove(ev.clientX, ev.clientY);
      const onTouchMove = (ev) => { if (ev.touches[0]) onMove(ev.touches[0].clientX, ev.touches[0].clientY); };
      const stop = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', stop);
        document.removeEventListener('touchmove', onTouchMove);
        document.removeEventListener('touchend', stop);
        const finalRect = windowEl.getBoundingClientRect();
        state.windowPositions[key] = { top: finalRect.top, left: finalRect.left };
      };
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', stop);
      document.addEventListener('touchmove', onTouchMove, { passive: true });
      document.addEventListener('touchend', stop);
    };
    titleEl.onmousedown = (ev) => {
      if (ev.target.closest('button')) return; // ما نسحب لو ضاغط زر الإغلاق
      ev.preventDefault();
      startDrag(ev.clientX, ev.clientY);
    };
    titleEl.ontouchstart = (ev) => {
      if (ev.target.closest('button')) return;
      if (ev.touches[0]) startDrag(ev.touches[0].clientX, ev.touches[0].clientY);
    };
  });
}

function render() {
  const root = document.getElementById('root');
  if (state.licenseExpired) {
    root.innerHTML = renderLicenseExpiredScreen();
    return;
  }
  if (!state.session) {
    root.innerHTML = renderAuth();
    bindAuthEvents();
  } else {
    root.innerHTML = renderApp();
    bindAppEvents();
    attachWindowDragging();
    applyWindowEntranceAnimation();
  }
  document.onclick = (ev) => {
    if (state.openDropdown && !ev.target.closest('[data-dropdown]') && !ev.target.closest('.dropdown-menu')) {
      state.openDropdown = null;
      render();
    }
    if (state.showAlertsPanel && !ev.target.closest('#alerts-bell-btn') && !ev.target.closest('[data-alert-target]')) {
      state.showAlertsPanel = false;
      render();
    }
    if (state.showSalesJumpList && !ev.target.closest('#si-number-jump-btn') && !ev.target.closest('#si-jump-panel')) {
      state.showSalesJumpList = false;
      render();
    }
    if (state.showAccountStatementSearch && !ev.target.closest('#as-account-search') && !ev.target.closest('#as-account-results')) {
      state.showAccountStatementSearch = false;
      render();
    }
  };
}

function bindAuthEvents() {
  document.getElementById('lang-toggle-btn').onclick = () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; render(); };
  document.getElementById('auth-toggle-pw').onclick = () => {
    const input = document.getElementById('auth-password');
    const icon = document.getElementById('auth-toggle-pw-icon');
    if (input.type === 'password') { input.type = 'text'; icon.className = 'ti ti-eye-off'; }
    else { input.type = 'password'; icon.className = 'ti ti-eye'; }
  };
  document.getElementById('auth-submit').onclick = async () => {
    const rawUsername = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if (!rawUsername || !password) { state.authError = 'أدخل اسم المستخدم وكلمة المرور'; render(); return; }
    const email = rawUsername.includes('@') ? rawUsername : `${rawUsername.toLowerCase()}@retailapp-users.com`;
    state.authLoading = true; state.authError = ''; render();
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      state.session = data.session;
      await loadProfile();
      await loadItems();
      await loadCompany();
      await loadParties();
      await loadPurchases();
      await loadSalesInvoices();
      await loadWarehouses();
      await loadPaymentMethods();
      logActivity('تسجيل دخول');
      loadAlerts().then(() => render()); // بالخلفية، ما نوقف تسجيل الدخول لحد ما يخلص
    } catch (e) {
      state.authError = translateAuthError(e.message);
    }
    state.authLoading = false;
    render();
  };
}

function translateAuthError(msg) {
  if (/invalid login credentials/i.test(msg)) return 'اسم المستخدم أو كلمة المرور غير صحيحة';
  if (/already registered/i.test(msg)) return 'اسم المستخدم هذا مسجّل مسبقاً';
  if (/password/i.test(msg) && /least/i.test(msg)) return 'كلمة المرور قصيرة جداً (6 أحرف على الأقل)';
  return msg;
}

async function loadBundleComponents(itemId) {
  const { data } = await sb.from('item_bundle_components').select('id, quantity, component_item_id, items!item_bundle_components_component_item_id_fkey(name)').eq('parent_item_id', itemId);
  state.bundleComponents = (data || []).map(r => ({ id: r.id, quantity: r.quantity, component_name: r.items ? r.items.name : '' }));
}

async function loadItemRelations(itemId) {
  const { data } = await sb.from('item_relations').select('id, related_item_id, items!item_relations_related_item_id_fkey(name)').eq('item_id', itemId);
  state.itemRelations = (data || []).map(r => ({ id: r.id, related_name: r.items ? r.items.name : '' }));
}

async function loadParties() {
  const { data, error } = await sb.from('parties').select('*').order('created_at', { ascending: false });

}

function filteredParties() {
  const q = state.partyQuery.trim().toLowerCase();
  return state.parties.filter(p => p.party_type === state.partyTypeFilter && (
    !q || (p.name||'').toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q) || (p.phone||'').includes(q)
  ));
}

  return state.purchases.filter(p => (p.invoice_number||'').toLowerCase().includes(q) || (p.parties?.name||'').toLowerCase().includes(q));

async function openPurchaseById(id) {
  const inv = state.purchases.find(p => p.id === id);
  if (!inv) return;
  const { data: lineRows } = await sb.from('purchase_invoice_items').select('*, items(name, sku, unit)').eq('invoice_id', id);
  state.purchaseForm = {

    supplier_ref: inv.supplier_ref || '', order_number: inv.order_number || '', warehouse_id: inv.warehouse_id || defaultWarehouseId(), invoice_date: inv.invoice_date,
    discount: String(inv.discount || 0), paid_amount: String(inv.paid_amount || 0), notes: inv.notes || '',
    approved: !!inv.approved,
    lines: (lineRows || []).map(l => ({
      item_id: l.item_id, item_name: l.items?.name || '', sku: l.items?.sku || '', unit: l.items?.unit || '',
      quantity: Number(l.quantity), unit_cost: Number(l.unit_cost), tax_percent: Number(l.tax_percent || 15),

function renderSummaryCards(results) {
  const count = results.length;
  const total = results.reduce((s,r) => s + Number(r.total||0), 0);
  const tax = results.reduce((s,r) => s + Number(r.tax_total||0), 0);
  const avg = count ? total / count : 0;
  const card = (label, value, color, bg) => `
    <div style="border:1px solid #A9A48C;border-radius:4px;padding:10px 12px;background:${bg};">
      <div style="font-size:10.5px;color:#5F5E5A;margin-bottom:2px;">${label}</div>
      <div style="font-size:15px;font-weight:600;color:${color};" class="mono">${value}</div>
    </div>`;
  return card('عدد السجلات', count, '#3A3826', '#F4F1EA')
    + card('إجمالي المبلغ', fmt(total), '#2C4A6E', '#E6F1FB')
    + card('إجمالي الضريبة', fmt(tax), '#BA7517', '#FAEEDA')
    + card('متوسط السجل', fmt(avg), '#0F6E56', '#E1F5EE');
}

// ---------- PURCHASES REPORT (كشف فواتير المشتريات) ----------
function getPeriodRange(period) {
  const today = new Date();
  const fmt = d => d.toISOString().slice(0,10);
  if (period === 'اليوم') return { from: fmt(today), to: fmt(today) };
  if (period === 'الأسبوع') {
    const d = new Date(today); d.setDate(d.getDate() - 7);
    return { from: fmt(d), to: fmt(today) };
  }
  if (period === 'الشهر') {
    const d = new Date(today.getFullYear(), today.getMonth(), 1);
    return { from: fmt(d), to: fmt(today) };
  }
  return null;
}

function filterPurchasesReport() {
  const f = state.purchasesReportFilters;
  let range = f.period === 'فترة' ? { from: f.fromDate, to: f.toDate } : getPeriodRange(f.period);
  return state.purchases.filter(p => {
    if (f.type !== 'الكل' && p.invoice_type !== f.type) return false;
    if (f.status === 'معتمدة' && !p.approved) return false;
    if (f.status === 'مسودة' && p.approved) return false;
    if (f.supplierId && p.supplier_id !== f.supplierId) return false;
    if (range && range.from && p.invoice_date < range.from) return false;
    if (range && range.to && p.invoice_date > range.to) return false;
    return true;
  });
}

function saveAreaAsPDF(areaSelector, filename, btnId) {
  const el = document.querySelector(areaSelector);
  if (!el || !window.html2pdf) { alert('تعذّر إنشاء ملف PDF — تأكد من الاتصال بالإنترنت وحاول من جديد'); return; }
  const btn = btnId ? document.getElementById(btnId) : null;
  if (btn) setBtnLoading(btn, true, 'جاري الإنشاء');
  const overlay = el.parentElement;
  // نحفظ كل الأنماط الأصلية اللي راح نعدّلها مؤقتاً، عشان نرجّعها بعد التصوير بالضبط
  const prev = {
    maxHeight: el.style.maxHeight, overflowY: el.style.overflowY, height: el.style.height,
    width: el.style.width, maxWidth: el.style.maxWidth, boxShadow: el.style.boxShadow, border: el.style.border, borderRadius: el.style.borderRadius,
    position: el.style.position, margin: el.style.margin,
    overlayPosition: overlay?.style.position, overlayDisplay: overlay?.style.display, overlayPadding: overlay?.style.padding, overlayBackground: overlay?.style.background,
  };
  const noPrintEls = Array.from(el.querySelectorAll('.no-print'));
  const printOnlyEls = Array.from(el.querySelectorAll('.print-only'));
  const prevNoPrintDisplay = noPrintEls.map(n => n.style.display);
  const prevPrintOnlyDisplay = printOnlyEls.map(n => n.style.display);
  // نطبّق التوسعة والتنسيق الرسمي على العنصر الأصلي فعلياً (مو بس على نسخة مستنسخة) — عشان نقيس الأبعاد الحقيقية النهائية بعدها
  el.style.maxHeight = 'none'; el.style.overflowY = 'visible'; el.style.height = 'auto';
  el.style.width = '100%'; el.style.maxWidth = '100%'; el.style.boxShadow = 'none'; el.style.border = 'none'; el.style.borderRadius = '0';
  el.style.position = 'static'; el.style.margin = '0';
  if (overlay) { overlay.style.position = 'static'; overlay.style.display = 'block'; overlay.style.padding = '0'; overlay.style.background = 'none'; }
  noPrintEls.forEach(n => { n.style.display = 'none'; });
  printOnlyEls.forEach(n => { n.style.display = 'block'; });
  // نقيس الأبعاد الحقيقية النهائية بعد التوسعة الكاملة — هذا يضمن التقاط العرض الصحيح كامل، مو العرض الضيق القديم
  const fullHeight = el.scrollHeight;
  const fullWidth = el.scrollWidth;
  const restoreAll = () => {
    el.style.maxHeight = prev.maxHeight; el.style.overflowY = prev.overflowY; el.style.height = prev.height;
    el.style.width = prev.width; el.style.maxWidth = prev.maxWidth; el.style.boxShadow = prev.boxShadow; el.style.border = prev.border; el.style.borderRadius = prev.borderRadius;
    el.style.position = prev.position; el.style.margin = prev.margin;
    if (overlay) { overlay.style.position = prev.overlayPosition; overlay.style.display = prev.overlayDisplay; overlay.style.padding = prev.overlayPadding; overlay.style.background = prev.overlayBackground; }
    noPrintEls.forEach((n,i) => { n.style.display = prevNoPrintDisplay[i]; });
    printOnlyEls.forEach((n,i) => { n.style.display = prevPrintOnlyDisplay[i]; });
  };
  html2pdf().set({
    margin: 8,
    html2canvas: {
      scale: 2,
      useCORS: true,
      height: fullHeight,
      windowHeight: fullHeight,
      width: fullWidth,
      windowWidth: fullWidth,
    },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] },
  }).from(el).outputPdf('blob').then((blob) => {
    restoreAll();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (btn) setBtnLoading(btn, false);
  }).catch(() => {
    restoreAll();
    if (btn) setBtnLoading(btn, false);
    alert('حدث خطأ أثناء إنشاء ملف PDF');
  });
}

// تصدير محاسبي منسّق (خط عريض + تلوين رأس الجدول) — لمشاركته مع محاسب خارجي بشكل احترافي
function exportFormattedAccountingSheet(filename, sheetName, headers, rows) {
  if (typeof XLSX === 'undefined') { alert('مكتبة تصدير Excel ما تحمّلت، تأكد من الاتصال بالإنترنت'); return; }
  const headerStyle = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1B3352' } }, alignment: { horizontal: 'center' } };
  const data = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(data);
  headers.forEach((h, i) => {
    const cellRef = XLSX.utils.encode_cell({ r:0, c:i });
    if (ws[cellRef]) ws[cellRef].s = headerStyle;
  });
  ws['!cols'] = headers.map((h, i) => {
    const maxLen = Math.max(h.length, ...rows.map(r => String(r[i]??'').length));
    return { wch: Math.min(Math.max(maxLen + 2, 10), 35) };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

function exportToExcel(filename, headers, rows) {
  if (typeof XLSX === 'undefined') { alert('مكتبة تصدير Excel ما تحمّلت، تأكد من الاتصال بالإنترنت'); return; }
  const data = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'كشف');
  XLSX.writeFile(wb, filename);
}

function downloadExcelTemplate(filename, headers, exampleRow) {
  if (typeof XLSX === 'undefined') { alert('مكتبة Excel ما تحمّلت، تأكد من الاتصال بالإنترنت'); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, exampleRow]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'نموذج');
  XLSX.writeFile(wb, filename);
}

function readExcelFile(file, callback) {
  if (typeof XLSX === 'undefined') { alert('مكتبة Excel ما تحمّلت، تأكد من الاتصال بالإنترنت'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      callback(rows.slice(1).filter(r => r.length && r[0] !== ''));
    } catch (e) {
      alert('تعذّر قراءة الملف، تأكد إنه بصيغة Excel صحيحة');
    }
  };
  reader.readAsArrayBuffer(file);
}

  purchase_invoices2: { title: 'كشف فواتير المشتريات', table: 'purchase_invoices', numField: 'invoice_number', partyField: 'supplier_id', partyLabel: 'المورد', partyType: 'supplier', hasType: true, hasStatus: true },
  quotations: { title: 'كشف عروض الأسعار', table: 'quotations', numField: 'quote_number', partyField: 'customer_id', partyLabel: 'العميل', partyType: 'customer', hasType: false, hasStatus: false },
  sales_returns: { title: 'كشف مردودات المبيعات', table: 'sales_returns', numField: 'return_number', partyField: 'customer_id', partyLabel: 'العميل', partyType: 'customer', hasType: false, hasStatus: true },
  purchase_returns: { title: 'كشف مردودات المشتريات', table: 'purchase_returns', numField: 'return_number', partyField: 'supplier_id', partyLabel: 'المورد', partyType: 'supplier', hasType: false, hasStatus: true },
};

async function loadGenericReport(kind) {
  const cfg = REPORT_CONFIGS[kind];
  const dateField = cfg.table === 'quotations' ? 'quote_date' : cfg.table.includes('return') ? 'return_date' : 'invoice_date';
  const { data, error } = await sb.from(cfg.table).select('*, parties(name, tax_number)').order(dateField, { ascending: false });
  if (!error) state.genericReportData = data || [];
  state.genericReportKind = kind;
  state.genericReportFilters = { type: 'الكل', status: 'الكل', partyId: '', period: 'الشهر', fromDate: '', toDate: '' };
  state.genericReportResults = filterGenericReport();
}

function filterGenericReport() {
  const cfg = REPORT_CONFIGS[state.genericReportKind];
  const f = state.genericReportFilters;
  const dateField = cfg.table === 'quotations' ? 'quote_date' : cfg.table.includes('return') ? 'return_date' : 'invoice_date';
  let range = f.period === 'فترة' ? { from: f.fromDate, to: f.toDate } : getPeriodRange(f.period);
  return (state.genericReportData || []).filter(row => {
    if (cfg.hasType && f.type !== 'الكل' && row.invoice_type !== f.type) return false;
    if (cfg.hasStatus && f.status === 'معتمدة' && !row.approved) return false;
    if (cfg.hasStatus && f.status === 'مسودة' && row.approved) return false;
    if (f.partyId && row[cfg.partyField] !== f.partyId) return false;
    if (range && range.from && row[dateField] < range.from) return false;
    if (range && range.to && row[dateField] > range.to) return false;
    return true;
  });
}

}
function filteredStockCounts() {
  const q = state.stockCountQuery.trim().toLowerCase();

  return state.stockCounts.filter(x => (x.count_number||'').toLowerCase().includes(q));
}
function newStockCountForm() {
  return { count_number:'', warehouse_id: defaultWarehouseId(), count_date:new Date().toISOString().slice(0,10), notes:'', lines:[], approved:false };

async function openStockCountById(id) {

  if (!sc) return;
  const { data: lineRows } = await sb.from('stock_count_items').select('*, items(name, sku, unit)').eq('count_id', id);
  state.stockCountForm = {
    count_number: sc.count_number, warehouse_id: sc.warehouse_id || defaultWarehouseId(), count_date: sc.count_date, notes: sc.notes||'', approved: !!sc.approved,
    lines: (lineRows||[]).map(l => ({ item_id:l.item_id, item_name:l.items?.name||'', sku:l.items?.sku||'', unit:l.items?.unit||'', system_qty:Number(l.system_qty), counted_qty:Number(l.counted_qty) })),
  };
  state.editingStockCountId = id;
  state.showStockCountForm = true;
  if (sc.approved) await loadDocJournalNumbers('stock_count', id); else state.docJournalNumbers = [];
  render();
}

async function loadWarehouses() {
  const { data, error } = await sb.from('warehouses').select('*').order('is_default', { ascending: false }).order('name');
  if (!error) state.warehouses = data || [];
}
function filteredWarehouses() {
  const q = state.warehouseQuery.trim().toLowerCase();
  if (!q) return state.warehouses;
  return state.warehouses.filter(w => (w.name||'').toLowerCase().includes(q) || (w.code||'').toLowerCase().includes(q));
}
function defaultWarehouseId() {
  const d = state.warehouses.find(w => w.is_default);
  return d ? d.id : (state.warehouses[0] ? state.warehouses[0].id : '');
}
async function getWarehouseStock(itemId, warehouseId) {
  const { data } = await sb.from('item_warehouse_stock').select('qty').eq('item_id', itemId).eq('warehouse_id', warehouseId).maybeSingle();
  return data ? Number(data.qty) : 0;
}
async function adjustWarehouseStock(itemId, warehouseId, delta) {
  const { data } = await sb.from('item_warehouse_stock').select('qty').eq('item_id', itemId).eq('warehouse_id', warehouseId).maybeSingle();
  const current = data ? Number(data.qty) : 0;
  const next = current + delta;
  let error;
  if (data) {
    ({ error } = await sb.from('item_warehouse_stock').update({ qty: next }).eq('item_id', itemId).eq('warehouse_id', warehouseId));
  } else {
    ({ error } = await sb.from('item_warehouse_stock').insert({ item_id: itemId, warehouse_id: warehouseId, qty: next }));
  }
  if (error) { console.error('فشل تحديث رصيد المستودع للصنف', itemId, error); showToast('⚠️ تعذّر تحديث رصيد المستودع — راجع المخزون يدوياً', 'error'); return false; }
  return true;
}
async function loadItemWarehouseBreakdown(itemId) {
  const { data } = await sb.from('item_warehouse_stock').select('qty, warehouses(name)').eq('item_id', itemId);
  return data || [];
}

// ---------- WAREHOUSE STOCK REPORT (تقرير الكميات بالمستودعات) ----------
async function loadWarehouseStockReport() {
  const { data } = await sb.from('item_warehouse_stock').select('item_id, warehouse_id, qty');
  const map = new Map();
  (data||[]).forEach(row => {
    if (!map.has(row.item_id)) map.set(row.item_id, {});
    map.get(row.item_id)[row.warehouse_id] = Number(row.qty);
  });
  state.warehouseStockPivot = state.items.map(item => ({
    item_id: item.id, sku: item.sku, name: item.name, unit: item.unit,
    perWarehouse: map.get(item.id) || {},
    total: Object.values(map.get(item.id) || {}).reduce((s,v) => s+v, 0),
  }));
}
function filteredWarehouseStockPivot() {
  const q = state.warehouseStockReportQuery.trim().toLowerCase();
  if (!q) return state.warehouseStockPivot;
  return state.warehouseStockPivot.filter(r => r.name.toLowerCase().includes(q) || (r.sku||'').toLowerCase().includes(q));
}

  (purchLines||[]).forEach(l => rows.push({ date: l.purchase_invoices.invoice_date, type: 'شراء', doc: l.purchase_invoices.invoice_number, change: Number(l.quantity) }));

  const { data: salesLines } = await sb.from('sales_invoice_items').select('quantity, sales_invoices!inner(invoice_number, invoice_date, approved)').eq('item_id', itemId).eq('sales_invoices.approved', true);
  (salesLines||[]).forEach(l => rows.push({ date: l.sales_invoices.invoice_date, type: 'بيع', doc: l.sales_invoices.invoice_number, change: -Number(l.quantity) }));

  const { data: srLines } = await sb.from('sales_return_items').select('quantity, sales_returns!inner(return_number, return_date, approved)').eq('item_id', itemId).eq('sales_returns.approved', true);
  (srLines||[]).forEach(l => rows.push({ date: l.sales_returns.return_date, type: 'مردود بيع', doc: l.sales_returns.return_number, change: Number(l.quantity) }));

  const { data: prLines } = await sb.from('purchase_return_items').select('quantity, purchase_returns!inner(return_number, return_date, approved)').eq('item_id', itemId).eq('purchase_returns.approved', true);
  (prLines||[]).forEach(l => rows.push({ date: l.purchase_returns.return_date, type: 'مردود شراء', doc: l.purchase_returns.return_number, change: -Number(l.quantity) }));

  const { data: scLines } = await sb.from('stock_count_items').select('system_qty, counted_qty, stock_counts!inner(count_number, count_date, approved)').eq('item_id', itemId).eq('stock_counts.approved', true);
  (scLines||[]).forEach(l => { const diff = Number(l.counted_qty) - Number(l.system_qty); if (diff !== 0) rows.push({ date: l.stock_counts.count_date, type: 'جرد', doc: l.stock_counts.count_number, change: diff }); });

  const { data: trLines } = await sb.from('warehouse_transfer_items').select('quantity, warehouse_transfers!inner(transfer_number, transfer_date, approved)').eq('item_id', itemId).eq('warehouse_transfers.approved', true);
  (trLines||[]).forEach(l => { rows.push({ date: l.warehouse_transfers.transfer_date, type: 'تحويل (صادر/وارد)', doc: l.warehouse_transfers.transfer_number, change: 0 }); });

  rows.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  let balance = 0;
  rows.forEach(r => { balance += r.change; r.balance = balance; });
  state.itemMovementRows = rows;
}

// ينشئ مستخدم جديد بدون ما يأثر على جلسة المدير الحالية (يستخدم عميل مؤقت منفصل)
async function loadUsers() {
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: true });
  if (!error) state.users = data || [];
}

// ينشئ مستخدم جديد بدون ما يأثر على جلسة المدير الحالية (يستخدم عميل مؤقت منفصل) — غير مستخدمة حالياً بالواجهة، متاحة لو احتجناها لاحقاً
async function adminCreateUser(username, password, role, displayName) {
  const email = `${username.toLowerCase()}@retailapp-users.com`;
  const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const { data, error } = await tempClient.auth.signUp({ email, password });
  if (error) throw error;
  if (data.user) {
    await new Promise(r => setTimeout(r, 800));
    const { error: profileErr } = await sb.from('profiles').update({ role, display_name: displayName || username }).eq('id', data.user.id);
    if (profileErr) throw new Error('تم إنشاء المستخدم لكن فشل حفظ بياناته (الدور والاسم) — عدّلها يدوياً من قائمة المستخدمين');
  }
}

function isAdmin() {
  return state.profile && state.profile.role === 'admin';

function canApprove() {
  return isAdmin() || (state.profile && state.profile.can_approve);

function canManageCompany() {
  return isAdmin() || (state.profile && state.profile.can_manage_company);
}
function canManageBackup() {

}

async function loadItems() {
  const { data, error } = await sb.from('items').select('*').order('created_at', { ascending: false });
  if (!error) state.items = data || [];
}

function filteredItems() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.items;
  return state.items.filter(it =>
    (it.name || '').toLowerCase().includes(q) ||
    (it.sku || '').toLowerCase().includes(q) ||
    (it.company || '').toLowerCase().includes(q)
  );
}

function stockStatus(item) {
  const reorder = Number(item.reorder_at) || 0;
  const qty = Number(item.qty) || 0;
  if (qty <= reorder * 0.5) return { label: 'حرج', color: '#E24B4A', bg: '#FCEBEB' };
  if (qty <= reorder) return { label: 'قارب على النفاد', color: '#BA7517', bg: '#FAEEDA' };
  return { label: 'متوفر', color: '#0F6E56', bg: '#E1F5EE' };
}

// تحويل رقم لمبلغ مكتوب بالعربي (ريال وهللة)
function numberToArabicWords(amount) {
  const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
  const onesF = ['', 'إحدى', 'اثنتا', 'ثلاث', 'أربع', 'خمس', 'ست', 'سبع', 'ثمان', 'تسع'];
  const teens = ['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const hundreds = ['', 'مائة', 'مئتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

  function threeDigits(n) {
    const parts = [];
    const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), o = n % 10;
    if (h) parts.push(hundreds[h]);
    const rem = n % 100;
    if (rem >= 10 && rem <= 19) {
      parts.push(teens[rem - 10]);
    } else {
      if (o) parts.push(ones[o]);
      if (t) parts.push(tens[t]);
    }
    return parts.join(' و');
  }

  function convert(n) {
    if (n === 0) return 'صفر';
    const groups = [];
    const units = ['', 'ألف', 'مليون', 'مليار'];
    let i = 0;
    let temp = n;
    const chunks = [];
    while (temp > 0) { chunks.push(temp % 1000); temp = Math.floor(temp / 1000); }
    for (let idx = chunks.length - 1; idx >= 0; idx--) {
      const chunk = chunks[idx];
      if (chunk === 0) continue;
      let chunkText;
      if (idx === 1 && chunk === 1) chunkText = 'ألف';
      else if (idx === 1 && chunk === 2) chunkText = 'ألفان';
      else if (idx === 1) chunkText = threeDigits(chunk) + ' ' + 'ألف';
      else if (idx === 0) chunkText = threeDigits(chunk);
      else chunkText = threeDigits(chunk) + ' ' + units[idx];
      groups.push(chunkText);
    }
    return groups.join(' و');
  }

  const riyals = Math.floor(Math.abs(amount));
  const halalas = Math.round((Math.abs(amount) - riyals) * 100);
  let text = convert(riyals) + ' ريال سعودي';
  if (halalas > 0) text += ' و' + convert(halalas) + ' هللة';
  text += ' لا غير';
  return text;
}

// توليد رمز QR بمعيار هيئة الزكاة والضريبة (ZATCA) - صيغة TLV base64
function buildZatcaTLV(sellerName, vatNumber, timestampISO, totalWithVat, vatAmount) {
  function tlvField(tag, value) {
    const bytes = new TextEncoder().encode(value || '');
    return new Uint8Array([tag, bytes.length, ...bytes]);
  }
  const fields = [
    tlvField(1, sellerName || ''),
    tlvField(2, vatNumber || ''),
    tlvField(3, timestampISO || ''),
    tlvField(4, Number(totalWithVat || 0).toFixed(2)),
    tlvField(5, Number(vatAmount || 0).toFixed(2)),
  ];
  const totalLen = fields.reduce((s, f) => s + f.length, 0);
  const merged = new Uint8Array(totalLen);
  let offset = 0;
  fields.forEach(f => { merged.set(f, offset); offset += f.length; });
  let binary = '';
  merged.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

async function renderQRInto(elementId, tlvBase64) {
  const el = document.getElementById(elementId);
  if (!el) return;
  if (typeof QRCode === 'undefined') {
    console.error('مكتبة QRCode ما تحمّلت (تأكد من الاتصال بالإنترنت أو أعد تحميل الصفحة)');
    return;
  }
  try {
    await QRCode.toCanvas(el, tlvBase64, { width: 110, margin: 1 });
  } catch (e) { console.error('خطأ برسم QR:', e); }
}

function calcPurchaseTotals(f) {
  const rate = Number(f.exchange_rate) || 1; // كم ريال يساوي 1 وحدة من العملة الأجنبية (1 لو ريال سعودي)
  const subtotal = f.lines.reduce((s, l) => s + l.quantity * l.unit_cost, 0);
  const discount = Number(f.discount) || 0;
  const net = subtotal - discount;
  const taxTotal = f.lines.reduce((s, l) => s + (l.quantity * l.unit_cost) * (Number(l.tax_percent||15) / 100), 0);
  const grandTotal = net + taxTotal;
  const paid = Number(f.paid_amount) || 0;
  const due = grandTotal - paid;
  // المكافئ بالريال السعودي (يُستخدم فعلياً بالمخزون والقيود المحاسبية ورصيد المورد)
  const isForeign = f.currency && f.currency !== 'ريال سعودي';
  return {
    subtotal, discount, net, taxTotal, grandTotal, paid, due, rate, isForeign,
    subtotalSAR: subtotal * rate, netSAR: net * rate, taxTotalSAR: taxTotal * rate, grandTotalSAR: grandTotal * rate, paidSAR: paid * rate, dueSAR: due * rate,
  };
}

function renderDashboardSectionOld() {
  const from = state.dashboardFrom, to = state.dashboardTo;
  const inRange = (dateStr) => (!from || dateStr >= from) && (!to || dateStr <= to);

  const lowStock = state.items.filter(it => Number(it.qty) <= Number(it.reorder_at || 0));
  const inventoryValue = state.items.reduce((s, it) => s + Number(it.qty||0) * Number(it.cost||0), 0);
  const customers = state.parties.filter(p => p.party_type === 'customer');
  const suppliers = state.parties.filter(p => p.party_type === 'supplier');
  const receivable = customers.reduce((s, p) => s + Number(p.balance||0), 0);
  const payable = suppliers.reduce((s, p) => s + Number(p.balance||0), 0);
  const approvedSales = state.salesInvoices.filter(s => s.approved && inRange(s.invoice_date));
  const approvedPurchases = state.purchases.filter(p => p.approved && inRange(p.invoice_date));
  const salesTotal = approvedSales.reduce((s, p) => s + Number(p.total||0), 0);
  const purchasesTotal = approvedPurchases.reduce((s, p) => s + Number(p.total||0), 0);
  const netEstimate = salesTotal - purchasesTotal;
  const recentSales = [...state.salesInvoices].filter(s => inRange(s.invoice_date)).sort((a,b) => (b.invoice_date||'').localeCompare(a.invoice_date||'')).slice(0, 5);
  const recentPurchases = [...state.purchases].filter(p => inRange(p.invoice_date)).sort((a,b) => (b.invoice_date||'').localeCompare(a.invoice_date||'')).slice(0, 5);
  const totalSalesInRange = state.salesInvoices.filter(s => inRange(s.invoice_date)).length;

  // بيانات مبسّطة لرسم بياني صغير: مبيعات ومشتريات آخر 6 نقاط زمنية بالفترة المختارة (تجميع أسبوعي تقريبي)

    const buckets = {};
    approvedSales.forEach(s => { const k = (s.invoice_date||'').slice(0,7); buckets[k] = buckets[k] || {sales:0,purch:0}; buckets[k].sales += Number(s.total||0); });
    approvedPurchases.forEach(p => { const k = (p.invoice_date||'').slice(0,7); buckets[k] = buckets[k] || {sales:0,purch:0}; buckets[k].purch += Number(p.total||0); });

function renderSalesFormModal() {
  const f = state.salesForm;
  const customers = state.parties.filter(p => p.party_type === 'customer');
  const tot = calcLineTotals(f);
  const due = tot.grandTotal - (Number(f.paid_amount)||0);
  // ربح الفاتورة (قبل الحفظ): لكل سطر = الكمية × (سعر البيع - التكلفة الحالية)، والإجمالي بعد الخصم
  const lineProfits = f.lines.map(l => {
    const item = state.items.find(it => it.id === l.item_id);
    const cost = item ? Number(item.cost||0) : 0;
    return { ...l, cost, profit: l.quantity * (l.unit_price - cost) };
  });
  const profitBeforeDiscount = lineProfits.reduce((s,l) => s + l.profit, 0);
  const invoiceProfit = profitBeforeDiscount - (Number(f.discount)||0);
  return `

const LABEL_FORMAT_DEFAULT = { showName: false, showPrice: false, showCodeText: true, widthMm: 40, heightMm: 25 };
function getLabelFormat() {
  try {
    const saved = JSON.parse(localStorage.getItem('barcodeLabelFormat') || 'null');
    if (saved && typeof saved === 'object') return { ...LABEL_FORMAT_DEFAULT, ...saved };

  return { ...LABEL_FORMAT_DEFAULT };
}

  try { localStorage.setItem('barcodeLabelFormat', JSON.stringify(fmt)); } catch(e) {}
}

function renderCashReconModal() {
  const expected = state.cashReconExpected;
  const actual = Number(state.cashReconActual) || 0;
  const hasEntered = state.cashReconActual !== '';
  const diff = actual - expected;
  const today = new Date().toISOString().slice(0,10);
  return `
  <div id="cr-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;">
    <div style="background:#fff;border:1px solid #1B3352;border-radius:14px;width:100%;max-width:550px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.35);" onclick="event.stopPropagation()">
      <div class="win-title"><span>تطابق الصندوق آخر اليوم</span><button id="cr-close" style="width:18px;height:18px;background:#D9534F;border:none;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;"><i class="ti ti-x" style="color:#fff;font-size:12px;"></i></button></div>
      <div style="padding:16px;">
        <div style="background:#FAF9F4;border-radius:10px;padding:14px;margin-bottom:14px;">
          <div style="font-size:11px;color:#5F5E5A;margin-bottom:4px;">تاريخ اليوم: <span class="mono">${today}</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13px;font-weight:600;">النقد المتوقع بالصندوق (محسوب تلقائياً من حركات اليوم)</span>
            <span style="font-size:19px;font-weight:700;color:#1B3352;" class="mono">${fmt(expected)}</span>
          </div>
        </div>
        ${partyField('النقد الفعلي بالصندوق (بعد العدّ اليدوي) *', `<input id="cr-actual" class="input mono" style="font-size:16px;" value="${escapeHtml(state.cashReconActual)}" placeholder="اكتب المبلغ اللي عددته فعلياً" />`)}
        ${hasEntered ? `
        <div style="background:${Math.abs(diff)<0.01?'#E1F5EE':diff>0?'#FAEEDA':'#FCEBEB'};border:1px solid ${Math.abs(diff)<0.01?'#0F6E56':diff>0?'#BA7517':'#C0392B'};border-radius:8px;padding:12px;margin:12px 0;text-align:center;">
          <div style="font-size:12px;color:#5F5E5A;">${Math.abs(diff)<0.01?'✓ الصندوق مطابق تماماً':diff>0?'⚠️ زيادة بالصندوق':'⚠️ نقص بالصندوق'}</div>
          <div style="font-size:20px;font-weight:700;color:${Math.abs(diff)<0.01?'#0F6E56':diff>0?'#BA7517':'#C0392B'};" class="mono">${diff>0?'+':''}${fmt(diff)}</div>
        </div>` : ''}
        ${partyField('ملاحظات (اختياري)', `<input id="cr-notes" class="input" placeholder="سبب الفرق لو فيه، أو أي ملاحظة" />`)}
        <button id="cr-save-btn" class="btn primary" style="padding:8px 16px;margin-top:8px;">حفظ تطابق اليوم</button>

        <div style="font-size:11px;font-weight:600;color:#5F5E5A;margin:18px 0 8px;">آخر 15 يوم</div>
        <div style="border:1px solid #A9A48C;border-radius:6px;overflow:hidden;overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;">
            <thead><tr>${['التاريخ','المتوقع','الفعلي','الفرق'].map(h => `<th style="padding:6px 8px;background:linear-gradient(180deg,#3D6389,#1B3352);color:#fff;font-size:10.5px;text-align:right;">${h}</th>`).join('')}</tr></thead>
            <tbody>
              ${state.cashReconciliations.map((r,i) => { const bg = i%2?'#F4F1EA':'#FFFDF6'; const d = Number(r.difference); return `
              <tr>
                <td class="mono" style="padding:5px 8px;background:${bg};font-size:11px;border-bottom:1px solid #E4E2DA;">${escapeHtml(r.recon_date)}</td>
                <td class="mono" style="padding:5px 8px;background:${bg};font-size:11px;border-bottom:1px solid #E4E2DA;">${fmt(r.expected_cash)}</td>
                <td class="mono" style="padding:5px 8px;background:${bg};font-size:11px;border-bottom:1px solid #E4E2DA;">${fmt(r.actual_cash)}</td>
                <td class="mono" style="padding:5px 8px;background:${bg};font-size:11px;font-weight:600;color:${Math.abs(d)<0.01?'#0F6E56':d>0?'#BA7517':'#C0392B'};border-bottom:1px solid #E4E2DA;">${d>0?'+':''}${fmt(d)}</td>

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function renderIncomeStatementOdooStyle(d) {
  const totalRevenue = d.netSales + d.totalOtherRevenue;
  const pct = (v) => totalRevenue > 0 ? Math.round(Math.abs(v)/totalRevenue*100) + '%' : '—';
  const sectionHeader = (icon, label, amount, bg, color) => `
    <div style="display:flex;align-items:center;padding:10px 14px;background:${bg};font-weight:700;font-size:13px;border-top:1px solid #DEDACB;">
      <i class="ti ${icon}" style="font-size:16px;margin-left:8px;color:${color};"></i>
      <span style="flex:1;color:${color};">${label}</span><span style="width:100px;text-align:left;color:${color};" class="mono">${fmt(amount)}</span><span style="width:50px;text-align:left;color:${color};font-size:11px;">${pct(amount)}</span>
    </div>`;
  const detailRow = (label, amount) => `
    <div style="padding:7px 14px 7px 42px;display:flex;align-items:center;font-size:12px;border-bottom:1px solid #EDEAE0;">
      <span style="flex:1;color:#5F5E5A;">${escapeHtml(label)}</span><span style="width:100px;text-align:left;" class="mono">${fmt(amount)}</span><span style="width:50px;text-align:left;color:#8B8A7A;font-size:10.5px;">${pct(amount)}</span>
    </div>`;
  const revenueRows = [...d.salesRows, ...(d.salesReturnsRows.length ? [{name:'يُخصم: مردودات مبيعات', amount:-d.salesReturnsRows.reduce((s,r)=>s+r.amount,0)}] : []), ...d.otherRevenueRows];
  const costRows = [...d.cogsRows, ...(d.purchaseReturnsRows.length ? [{name:'يُخصم: مردودات مشتريات', amount:-d.purchaseReturnsRows.reduce((s,r)=>s+r.amount,0)}] : [])];
  const opexRows = [...d.operatingRows, ...d.adminRows, ...d.otherExpenseRows];
  const totalOpex = d.totalOperating + d.totalOtherExpense;
  return `
  <div style="display:flex;padding:6px 14px;font-size:10px;color:#8B8A7A;">
    <span style="flex:1;">البند</span><span style="width:100px;text-align:left;">المبلغ</span><span style="width:50px;text-align:left;">النسبة</span>
  </div>
  <div style="border:1px solid #DEDACB;border-radius:8px;overflow:hidden;">
    ${sectionHeader('ti-trending-up', 'الإيرادات', totalRevenue, '#E1F5EE', '#0F6E56')}
    ${revenueRows.map(r => detailRow(r.name, r.amount)).join('')}

    ${sectionHeader('ti-package', 'تكلفة المبيعات', d.netCogs, '#FCEBEB', '#C0392B')}
    ${costRows.map(r => detailRow(r.name, r.amount)).join('')}

    <div style="display:flex;align-items:center;padding:10px 14px;font-weight:700;font-size:13px;border-top:2px solid #A9A48C;">
      <i class="ti ti-report-money" style="font-size:16px;margin-left:8px;color:#5F5E5A;"></i>
      <span style="flex:1;">إجمالي الربح</span><span style="width:100px;text-align:left;" class="mono">${fmt(d.grossProfit)}</span><span style="width:50px;text-align:left;color:#8B8A7A;font-size:11px;">${pct(d.grossProfit)}</span>
    </div>

    ${opexRows.length > 0 ? `
    ${sectionHeader('ti-receipt', 'المصاريف', totalOpex, '#FAEEDA', '#BA7517')}
    ${opexRows.map(r => detailRow(r.name, r.amount)).join('')}` : ''}

    <div style="display:flex;align-items:center;padding:14px;background:${d.netIncome>=0?'#0F6E56':'#C0392B'};font-weight:700;font-size:14px;border-top:1px solid #DEDACB;">
      <i class="ti ${d.netIncome>=0?'ti-circle-check':'ti-alert-circle'}" style="font-size:18px;margin-left:8px;color:#fff;"></i>
      <span style="flex:1;color:#fff;">${d.netIncome>=0?'صافي الربح':'صافي الخسارة'}</span><span style="width:100px;text-align:left;color:#fff;" class="mono">${fmt(Math.abs(d.netIncome))}</span><span style="width:50px;text-align:left;color:#fff;font-size:11px;">${pct(d.netIncome)}</span>
    </div>
  </div>
  <div class="no-print" style="font-size:11px;color:#5F5E5A;margin-top:8px;">${t('is_inventory_ref')}: <b class="mono">${fmt(d.inventoryValue)}</b></div>`;
}

function renderIncomeStatementTForm(d) {
  const totalExpenseSide = d.netCogs + d.totalOperating + d.totalOtherExpense;
  const totalRevenueSide = d.netSales + d.totalOtherRevenue;
  const isProfit = d.netIncome >= 0;
  const row = (label, amount, opts) => {
    opts = opts || {};
    return `<div style="display:flex;justify-content:space-between;padding:${opts.bold?'7px':'5px'} 10px;font-size:${opts.bold?'12px':'11px'};${opts.bold?'font-weight:700;background:#F4F1EA;':'border-bottom:1px solid #eee;'}"><span>${label}</span><span class="mono">${fmt(amount)}</span></div>`;
  };
  const expenseRows = [
    ...d.cogsRows.map(r => row(r.name, r.amount)),
    d.purchaseReturnsRows.length ? row('يُخصم: مردودات مشتريات', -d.purchaseReturnsRows.reduce((s,r)=>s+r.amount,0)) : '',
    ...d.operatingRows.map(r => row(r.name, r.amount)),
    ...d.adminRows.map(r => row(r.name, r.amount)),
    ...d.otherExpenseRows.map(r => row(r.name, r.amount)),
  ].filter(Boolean).join('');
  const revenueRows = [
    ...d.salesRows.map(r => row(r.name, r.amount)),
    d.salesReturnsRows.length ? row('يُخصم: مردودات مبيعات', -d.salesReturnsRows.reduce((s,r)=>s+r.amount,0)) : '',
    ...d.otherRevenueRows.map(r => row(r.name, r.amount)),
  ].filter(Boolean).join('');
  const balancedTotal = isProfit ? totalRevenueSide : totalExpenseSide;
  return `
  <div style="border:2px solid #000;">
    <div style="background:#FDF3E2;font-weight:700;font-size:12.5px;padding:8px;text-align:center;border-bottom:2px solid #000;">مدين — المصاريف</div>
    ${expenseRows}
    ${isProfit ? row('صافي الربح (يُرحّل لحق الملكية)', d.netIncome, { bold:true }) : ''}
    <div style="display:flex;justify-content:space-between;padding:8px 10px;font-weight:700;font-size:12.5px;background:#1B3352;color:#fff;border-top:2px solid #000;border-bottom:4px double #000;"><span>إجمالي المصاريف</span><span class="mono">${fmt(balancedTotal)}</span></div>

    <div style="background:#E1F5EE;font-weight:700;font-size:12.5px;padding:8px;text-align:center;border-bottom:2px solid #000;">دائن — الإيرادات</div>
    ${revenueRows}
    ${!isProfit ? row('صافي الخسارة', -d.netIncome, { bold:true }) : ''}
    <div style="display:flex;justify-content:space-between;padding:8px 10px;font-weight:700;font-size:12.5px;background:#1B3352;color:#fff;border-top:2px solid #000;"><span>إجمالي الإيرادات</span><span class="mono">${fmt(balancedTotal)}</span></div>
  </div>
  <div class="no-print" style="font-size:11px;color:#5F5E5A;margin-top:8px;">${t('is_inventory_ref')}: <b class="mono">${fmt(d.inventoryValue)}</b></div>`;
}

function iconBtn(id, icon, color, label, disabled) {
  return `<button id="${id}" ${disabled ? 'disabled' : ''} style="display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#FDFBF3,#E9E4D0);border:1px solid #A9A48C;border-radius:4px;padding:7px 14px;cursor:${disabled?'default':'pointer'};min-width:60px;opacity:${disabled?'0.4':'1'};">
    <i class="ti ${icon}" style="font-size:20px;color:${color};"></i>
    <span style="font-size:11px;color:#3A3826;">${label}</span>
  </button>`;
}

function field(label, inputHtml) {
  return `<div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12.5px;color:#3A3826;min-width:90px;">${label}</label><div style="flex:1;">${inputHtml}</div></div>`;
}

// يربط قائمة اختيار صنف بشريط معلومات + تعبئة تلقائية للكمية والسعر + تركيز مباشر
async function loadLastSalePrices(itemId, limit = 5) {
  const { data, error } = await sb.from('sales_invoice_items').select('unit_price, sales_invoices(invoice_date, invoice_number, approved)').eq('item_id', itemId).order('created_at', { ascending: false }).limit(30);
  if (error || !data) return [];
  const rows = data.filter(r => r.sales_invoices && r.sales_invoices.approved)
    .sort((a,b) => (b.sales_invoices.invoice_date||'').localeCompare(a.sales_invoices.invoice_date||''))
    .slice(0, limit);
  return rows.map(r => ({ price: Number(r.unit_price), date: r.sales_invoices.invoice_date, invoiceNumber: r.sales_invoices.invoice_number }));
}
async function loadLastPurchasePrices(itemId, limit = 3) {
  const { data, error } = await sb.from('purchase_invoice_items').select('unit_cost, purchase_invoices(invoice_date, invoice_number, approved)').eq('item_id', itemId).order('created_at', { ascending: false }).limit(30);
  if (error || !data) return [];
  const rows = data.filter(r => r.purchase_invoices && r.purchase_invoices.approved)
    .sort((a,b) => (b.purchase_invoices.invoice_date||'').localeCompare(a.purchase_invoices.invoice_date||''))
    .slice(0, limit);
  return rows.map(r => ({ price: Number(r.unit_cost), date: r.purchase_invoices.invoice_date, invoiceNumber: r.purchase_invoices.invoice_number }));
}

// يحدد سعر الصنف المناسب حسب "مستوى السعر" المسجّل بكرت العميل (سعر1/سعر2/سعر3)
// يرجع السعر الأساسي (price) لو العميل مو محدد، أو مستوى سعره فاضي/صفر بالصنف
function getItemPriceForCustomer(item, customerId) {
  if (!item) return '';
  const customer = customerId ? state.parties.find(p => p.id === customerId) : null;
  const level = customer ? customer.price_level : null;
  if (level === 'سعر2' && item.price2) return item.price2;
  if (level === 'سعر3' && item.price3) return item.price3;
  return item.price || '';
}

function wireItemPickBehavior(selectId, infoId, qtyId, priceId, priceKey) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  sel.onchange = (ev) => {
    const item = state.items.find(it => it.id === ev.target.value);
    const info = document.getElementById(infoId);
    if (item) {
      if (info) {
        info.style.display = 'block';
        info.innerHTML = `<b>${escapeHtml(item.name)}</b> — <span class="mono">${escapeHtml(item.sku)}</span>`
          + ` &nbsp;·&nbsp; الرصيد: <span class="mono">${item.qty}</span>`
          + (priceKey ? ` &nbsp;·&nbsp; ${priceKey==='cost'?'آخر تكلفة':'سعر البيع'}: <span class="mono">${fmt(item[priceKey])}</span>` : '');
      }
      const qtyEl = qtyId ? document.getElementById(qtyId) : null;
      const priceEl = priceId ? document.getElementById(priceId) : null;
      if (priceEl && !priceEl.value && priceKey) priceEl.value = item[priceKey] || '';
      if (qtyEl) { if (!qtyEl.value) qtyEl.value = '1'; qtyEl.focus(); qtyEl.select(); }
    } else if (info) {
      info.style.display = 'none';
    }
  };
}

// ---------- DESIGNER PANEL (كلمة سر مشفّرة SHA-256 - النص الأصلي غير مخزّن بالكود) ----------
const DESIGNER_PASSWORD_HASH = 'f8571f75f919f47d31dbbdc4e725ac0abb2908bf276eea8556f5b0b7c0f2847e';
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function designerLogPush(type, text) {
  state.designerLog.unshift({ type, text });
  if (state.designerLog.length > 30) state.designerLog.length = 30;
}

function crmDaysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / (1000*60*60*24));
}
function crmStatusBadge(client) {
  if (client.status === 'متوقف') return `<span style="background:#E4E2DA;color:#5F5E5A;padding:2px 8px;border-radius:10px;font-size:10.5px;">متوقف</span>`;
  const d = crmDaysUntil(client.subscription_end);
  if (d === null) return `<span style="background:#E4E2DA;color:#5F5E5A;padding:2px 8px;border-radius:10px;font-size:10.5px;">—</span>`;
  if (d < 0) return `<span style="background:#FCEBEB;color:#C0392B;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;">منتهي (${Math.abs(d)})</span>`;
  if (d <= 30) return `<span style="background:#FAEEDA;color:#BA7517;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;">قارب (${d})</span>`;
  return `<span style="background:#E1F5EE;color:#0F6E56;padding:2px 8px;border-radius:10px;font-size:10.5px;">نشط</span>`;
}

// ---------- كشف الإقرار الضريبي ----------
async function loadVatReport() {
  let salesQ = sb.from('sales_invoices').select('subtotal, tax_total, total').eq('approved', true);
  let purchQ = sb.from('purchase_invoices').select('subtotal, tax_total, total').eq('approved', true);
  let sretQ = sb.from('sales_returns').select('subtotal, tax_total, total').eq('approved', true);
  let pretQ = sb.from('purchase_returns').select('subtotal, tax_total, total').eq('approved', true);
  if (state.vatReportFrom) { salesQ = salesQ.gte('invoice_date', state.vatReportFrom); purchQ = purchQ.gte('invoice_date', state.vatReportFrom); sretQ = sretQ.gte('return_date', state.vatReportFrom); pretQ = pretQ.gte('return_date', state.vatReportFrom); }
  if (state.vatReportTo) { salesQ = salesQ.lte('invoice_date', state.vatReportTo); purchQ = purchQ.lte('invoice_date', state.vatReportTo); sretQ = sretQ.lte('return_date', state.vatReportTo); pretQ = pretQ.lte('return_date', state.vatReportTo); }
  const [{ data: sales }, { data: purchases }, { data: sret }, { data: pret }] = await Promise.all([salesQ, purchQ, sretQ, pretQ]);
  const sum = (rows, field) => (rows||[]).reduce((s,r) => s + Number(r[field]||0), 0);
  const salesSubtotal = sum(sales,'subtotal') - sum(sret,'subtotal');
  const outputVat = sum(sales,'tax_total') - sum(sret,'tax_total');
  const purchSubtotal = sum(purchases,'subtotal') - sum(pret,'subtotal');
  const inputVat = sum(purchases,'tax_total') - sum(pret,'tax_total');
  state.vatReportData = { salesSubtotal, outputVat, purchSubtotal, inputVat, netVat: outputVat - inputVat, salesCount:(sales||[]).length, purchCount:(purchases||[]).length };
}

// ---------- رسم بياني مبيعات ومشتريات ----------
let salesChartInstance = null;
async function loadChartData() {
  let salesQ = sb.from('sales_invoices').select('invoice_date, total').eq('approved', true);
  let purchQ = sb.from('purchase_invoices').select('invoice_date, total').eq('approved', true);
  if (state.chartFrom) { salesQ = salesQ.gte('invoice_date', state.chartFrom); purchQ = purchQ.gte('invoice_date', state.chartFrom); }
  if (state.chartTo) { salesQ = salesQ.lte('invoice_date', state.chartTo); purchQ = purchQ.lte('invoice_date', state.chartTo); }
  const [{ data: sales }, { data: purchases }] = await Promise.all([salesQ, purchQ]);
  const byMonth = {};
  (sales||[]).forEach(r => { const k = (r.invoice_date||'').slice(0,7); byMonth[k] = byMonth[k] || {sales:0,purch:0}; byMonth[k].sales += Number(r.total||0); });
  (purchases||[]).forEach(r => { const k = (r.invoice_date||'').slice(0,7); byMonth[k] = byMonth[k] || {sales:0,purch:0}; byMonth[k].purch += Number(r.total||0); });
  const months = Object.keys(byMonth).sort();

// ---------- قائمة الدخل (الأرباح والخسائر) ----------
async function loadIncomeStatement() {
  let q = sb.from('journal_entry_lines').select('account_code, debit, credit, journal_entries!inner(entry_date, source_type)').neq('journal_entries.source_type', 'closing');
  if (state.incomeStatementFrom) q = q.gte('journal_entries.entry_date', state.incomeStatementFrom);
  if (state.incomeStatementTo) q = q.lte('journal_entries.entry_date', state.incomeStatementTo);
  const { data } = await q;
  const byAccount = {};
  (data||[]).forEach(l => {
    if (!byAccount[l.account_code]) byAccount[l.account_code] = { debit: 0, credit: 0 };
    byAccount[l.account_code].debit += Number(l.debit||0);
    byAccount[l.account_code].credit += Number(l.credit||0);
  });
  const bal = (code, natural) => {
    const b = byAccount[code];
    if (!b) return 0;
    return natural === 'credit' ? (b.credit - b.debit) : (b.debit - b.credit);
  };
  const accName = (code) => state.chartOfAccounts.find(a => a.code === code)?.name || code;
  const rowsFor = (codes, natural) => codes.map(c => ({ code:c, name: accName(c), amount: bal(c, natural) })).filter(r => r.amount !== 0);

  // 1) قسم المتاجرة: صافي المبيعات وتكلفة البضاعة المباعة
  const salesRows = rowsFor(['410101','410102','4101'], 'credit');
  const salesReturnsRows = rowsFor(['4102'], 'debit'); // حساب مقابل، يُخصم من المبيعات
  const netSales = salesRows.reduce((s,r)=>s+r.amount,0) - salesReturnsRows.reduce((s,r)=>s+r.amount,0);

  const cogsRows = rowsFor(['5101'], 'debit');
  const purchaseReturnsRows = rowsFor(['5102'], 'credit'); // حساب مقابل، يُخصم من التكلفة
  const netCogs = cogsRows.reduce((s,r)=>s+r.amount,0) - purchaseReturnsRows.reduce((s,r)=>s+r.amount,0);
  const inventoryValue = state.items.reduce((s,it) => s + Number(it.qty||0)*Number(it.cost||0), 0);

  const grossProfit = netSales - netCogs;

  // 2) المصروفات التشغيلية والإدارية
  const operatingCodes = state.chartOfAccounts.filter(a => a.is_posting_account && a.code.startsWith('52')).map(a=>a.code);
  const adminCodes = state.chartOfAccounts.filter(a => a.is_posting_account && a.code.startsWith('53')).map(a=>a.code);
  const operatingRows = rowsFor([...new Set(operatingCodes)], 'debit');
  const adminRows = rowsFor([...new Set(adminCodes)], 'debit');
  const totalOperating = operatingRows.reduce((s,r)=>s+r.amount,0) + adminRows.reduce((s,r)=>s+r.amount,0);

  const operatingProfit = grossProfit - totalOperating;

  // 3) إيرادات ومصروفات أخرى (كل ماعدا المبيعات/التكلفة/التشغيلية أعلاه)
  const usedCodes = new Set([...salesRows,...salesReturnsRows,...cogsRows,...purchaseReturnsRows,...operatingRows,...adminRows].map(r=>r.code));
  const revenueAccounts = state.chartOfAccounts.filter(a => a.is_posting_account && a.account_type === 'revenue' && !usedCodes.has(a.code));
  const expenseAccounts = state.chartOfAccounts.filter(a => a.is_posting_account && a.account_type === 'expense' && !usedCodes.has(a.code));
  const otherRevenueRows = rowsFor(revenueAccounts.map(a=>a.code), 'credit');
  const otherExpenseRows = rowsFor(expenseAccounts.map(a=>a.code), 'debit');
  const totalOtherRevenue = otherRevenueRows.reduce((s,r)=>s+r.amount,0);
  const totalOtherExpense = otherExpenseRows.reduce((s,r)=>s+r.amount,0);

  const netIncome = operatingProfit + totalOtherRevenue - totalOtherExpense;

  state.incomeStatementData = {
    salesRows, salesReturnsRows, netSales,
    cogsRows, purchaseReturnsRows, netCogs, inventoryValue,
    grossProfit, operatingRows, adminRows, totalOperating, operatingProfit,
    otherRevenueRows, otherExpenseRows, totalOtherRevenue, totalOtherExpense,
    netIncome,
  };
}

// ---------- قائمة المركز المالي (الميزانية) ----------
async function loadBalanceSheet() {
  const asOf = state.balanceSheetAsOf;
  let q = sb.from('journal_entry_lines').select('account_code, debit, credit, journal_entries!inner(entry_date)');
  if (asOf) q = q.lte('journal_entries.entry_date', asOf);
  const { data } = await q;
  const byAccount = {};
  (data||[]).forEach(l => {
    if (!byAccount[l.account_code]) byAccount[l.account_code] = { debit: 0, credit: 0 };
    byAccount[l.account_code].debit += Number(l.debit||0);
    byAccount[l.account_code].credit += Number(l.credit||0);
  });
  const byType = (type, natural) => state.chartOfAccounts.filter(a => a.is_posting_account && a.account_type === type).map(a => {
    const bal = natural === 'debit' ? (byAccount[a.code]?.debit||0) - (byAccount[a.code]?.credit||0) : (byAccount[a.code]?.credit||0) - (byAccount[a.code]?.debit||0);
    return { code: a.code, name: a.name, amount: bal };
  }).filter(r => r.amount !== 0);

  const assetRows = byType('asset', 'debit');
  const liabilityRows = byType('liability', 'credit');
  const equityRows = byType('equity', 'credit');

  // صافي ربح/خسارة الفترة (من الإيرادات والمصروفات لحد تاريخ الميزانية) يُضاف لحقوق الملكية تلقائياً كـ"أرباح الفترة"
  const revenueAccounts = state.chartOfAccounts.filter(a => a.is_posting_account && a.account_type === 'revenue');
  const expenseAccounts = state.chartOfAccounts.filter(a => a.is_posting_account && a.account_type === 'expense');
  const totalRevenue = revenueAccounts.reduce((s,a) => s + ((byAccount[a.code]?.credit||0) - (byAccount[a.code]?.debit||0)), 0);
  const totalExpense = expenseAccounts.reduce((s,a) => s + ((byAccount[a.code]?.debit||0) - (byAccount[a.code]?.credit||0)), 0);
  const periodNetIncome = totalRevenue - totalExpense;
  if (Math.abs(periodNetIncome) > 0.01) equityRows.push({ code: '—', name: 'صافي ربح/خسارة الفترة (غير مقفل)', amount: periodNetIncome });

  const totalAssets = assetRows.reduce((s,r) => s+r.amount, 0);
  const totalLiabilities = liabilityRows.reduce((s,r) => s+r.amount, 0);
  const totalEquity = equityRows.reduce((s,r) => s+r.amount, 0);
  state.balanceSheetData = { assetRows, liabilityRows, equityRows, totalAssets, totalLiabilities, totalEquity, balanced: Math.abs(totalAssets - (totalLiabilities+totalEquity)) < 0.01 };
}

// ---------- كشف أعمار الذمم ----------
async function computeAgingForParty(partyId, isCustomer, asOf) {
  const invoiceTable = isCustomer ? 'sales_invoices' : 'purchase_invoices';
  const partyField = isCustomer ? 'customer_id' : 'supplier_id';
  const paymentTable = isCustomer ? 'receipt_vouchers' : 'payment_vouchers';
  const returnTable = isCustomer ? 'sales_returns' : 'purchase_returns';

  const { data: invoices } = await sb.from(invoiceTable).select('invoice_number, invoice_date, total, paid_amount')
    .eq(partyField, partyId).eq('invoice_type', 'آجل').eq('approved', true).lte('invoice_date', asOf).order('invoice_date', { ascending: true });
  const { data: payments } = await sb.from(paymentTable).select('amount, voucher_date').eq(partyField, partyId).eq('approved', true).lte('voucher_date', asOf);
  const { data: returns } = await sb.from(returnTable).select('total, payment_method, return_date').eq(partyField, partyId).eq('approved', true).lte('return_date', asOf);

  let queue = (invoices||[]).map(inv => ({
    invoice_number: inv.invoice_number, invoice_date: inv.invoice_date,
    due: Number(inv.total||0) - Number(inv.paid_amount||0),
  })).filter(inv => inv.due > 0.01);

  let totalPayments = (payments||[]).reduce((s,p) => s+Number(p.amount||0), 0);
  totalPayments += (returns||[]).filter(r => !r.payment_method).reduce((s,r) => s+Number(r.total||0), 0);

  // تخصيص المدفوعات لأقدم الفواتير أول (FIFO) — الأسلوب المعياري لكشف أعمار الذمم
  for (const inv of queue) {
    if (totalPayments <= 0.01) break;
    const applied = Math.min(inv.due, totalPayments);
    inv.due -= applied;
    totalPayments -= applied;
  }
  queue = queue.filter(inv => inv.due > 0.01);

  const buckets = { b0_30:0, b31_60:0, b61_90:0, b90plus:0 };
  const asOfDate = new Date(asOf);
  queue.forEach(inv => {
    const days = Math.floor((asOfDate - new Date(inv.invoice_date)) / 86400000);
    if (days <= 30) buckets.b0_30 += inv.due;
    else if (days <= 60) buckets.b31_60 += inv.due;
    else if (days <= 90) buckets.b61_90 += inv.due;
    else buckets.b90plus += inv.due;
  });
  const total = queue.reduce((s,i)=>s+i.due, 0);
  return { buckets, total, invoices: queue };
}

async function loadAgingReport() {
  const asOf = state.agingAsOf || new Date().toISOString().slice(0,10);
  const parties = state.parties.filter(p => p.party_type === state.agingReportType);

    if (result.total > 0.01) rows.push({ party: p, ...result });
  }
  rows.sort((a,b) => b.total - a.total);

}

async function loadNetPurchasesReport() {

// ---------- مركز التنبيهات الذكي ----------
async function loadAlerts() {
  const alerts = [];
  const today = new Date().toISOString().slice(0,10);

  // 1) أصناف نفدت أو وصلت حد الطلب
  const lowStock = state.items.filter(it => it.active !== false && Number(it.qty||0) <= Number(it.reorder_at||0));
  const outOfStock = lowStock.filter(it => Number(it.qty||0) <= 0);
  if (outOfStock.length > 0) alerts.push({ severity:'high', text:`${outOfStock.length} صنف نفد من المخزون تماماً`, target:'الاصناف' });
  const nearLow = lowStock.filter(it => Number(it.qty||0) > 0);
  if (nearLow.length > 0) alerts.push({ severity:'medium', text:`${nearLow.length} صنف وصل لحد إعادة الطلب`, target:'الاصناف' });

  // 2) عملاء متأخرين أكثر من 90 يوم (يستخدم نفس منطق كشف أعمار الذمم)
  const customers = state.parties.filter(p => p.party_type === 'customer' && Number(p.balance||0) > 0);
  let over90Count = 0, over90Total = 0;
  for (const c of customers.slice(0, 60)) { // حد أقصى معقول لتفادي إبطاء الفتح لو عندك مئات العملاء
    const result = await computeAgingForParty(c.id, true, today);
    if (result.buckets.b90plus > 0.01) { over90Count++; over90Total += result.buckets.b90plus; }
  }
  if (over90Count > 0) alerts.push({ severity:'high', text:`${over90Count} عميل متأخر بالسداد أكثر من 90 يوم (${fmt(over90Total)})`, target:'__aging_report__' });

  // 2ب) تذكير استباقي: عملاء تقترب فواتيرهم من موعد الاستحقاق (حسب مدة الائتمان المحدّدة لكل عميل)
  let dueSoonCount = 0;
  const creditCustomers = customers.filter(c => Number(c.credit_period_days||0) > 0);
  for (const c of creditCustomers.slice(0, 60)) {
    const { data: oldestInv } = await sb.from('sales_invoices').select('invoice_date').eq('customer_id', c.id).eq('approved', true).eq('invoice_type', 'آجل').order('invoice_date', { ascending: true }).limit(1);
    if (!oldestInv || !oldestInv[0]) continue;
    const dueDate = new Date(oldestInv[0].invoice_date);
    dueDate.setDate(dueDate.getDate() + Number(c.credit_period_days));
    const daysUntilDue = Math.round((dueDate - new Date(today)) / 86400000);
    if (daysUntilDue >= 0 && daysUntilDue <= 5) dueSoonCount++;
  }
  if (dueSoonCount > 0) alerts.push({ severity:'medium', text:`${dueSoonCount} عميل يقترب موعد استحقاقه خلال 5 أيام`, target:'__aging_report__' });

  // 3) فواتير محفوظة كمسودة أكثر من 3 أيام
  const threeDaysAgo = new Date(); threeDaysAgo.setDate(threeDaysAgo.getDate()-3);
  const { data: oldDraftSales } = await sb.from('sales_invoices').select('id').eq('approved', false).lte('created_at', threeDaysAgo.toISOString());
  const { data: oldDraftPurchases } = await sb.from('purchase_invoices').select('id').eq('approved', false).lte('created_at', threeDaysAgo.toISOString());
  const draftCount = (oldDraftSales||[]).length + (oldDraftPurchases||[]).length;
  if (draftCount > 0) alerts.push({ severity:'low', text:`${draftCount} فاتورة محفوظة كمسودة من أكثر من 3 أيام — تحتاج اعتماد أو حذف`, target:'المبيعات' });

  state.alerts = alerts;
}

async function runReportDesigner() {
  const src = RD_SOURCES[state.rdSource];
  if (!src) { state.rdRows = []; return; }
  const inRange = (d) => (!state.rdFrom || d >= state.rdFrom) && (!state.rdTo || d <= state.rdTo);
  let rows = [];
  if (state.rdSource === 'sales') {
    await loadSalesInvoices();

      invoice_type: inv.invoice_type, subtotal: Number(inv.subtotal||0), tax_total: Number(inv.tax_total||0),
      total: Number(inv.total||0), status: inv.approved ? 'معتمدة' : 'مسودة',
    }));
  } else if (state.rdSource === 'purchases') {
    await loadPurchases();
    rows = state.purchases.filter(inv => inRange(inv.invoice_date)).map(inv => ({
      invoice_number: inv.invoice_number, invoice_date: inv.invoice_date,

      invoice_type: inv.invoice_type, total: Number(inv.total||0), status: inv.approved ? 'معتمدة' : 'مسودة',
    }));
  } else if (state.rdSource === 'items') {
    await loadItems();
    rows = state.items.map(it => ({ sku: it.sku, name: it.name, category: it.category||'—', unit: it.unit, qty: Number(it.qty||0), price: Number(it.price||0), cost: Number(it.cost||0) }));
  } else if (state.rdSource === 'customers' || state.rdSource === 'suppliers') {

}

// الاستحقاق السنوي حسب نظام العمل السعودي: 21 يوم أول 5 سنوات، 30 يوم بعدها
function leaveEntitlement(employee) {
  if (!employee.hire_date) return 21;
  const years = (new Date() - new Date(employee.hire_date)) / (1000*60*60*24*365.25);
  return years >= 5 ? 30 : 21;
}
function daysBetween(start, end) {
  return Math.round((new Date(end) - new Date(start)) / (1000*60*60*24)) + 1;
}
function leaveBalanceForEmployee(employee, leaves) {
  const currentYear = new Date().getFullYear();
  const takenThisYear = leaves.filter(l => l.employee_id === employee.id && l.leave_type === 'سنوية' && new Date(l.start_date).getFullYear() === currentYear)
    .reduce((s,l) => s + Number(l.days_count||0), 0);
  const entitled = leaveEntitlement(employee);
  return { entitled, taken: takenThisYear, remaining: entitled - takenThisYear };
}

// حساب مكافأة نهاية الخدمة حسب نظام العمل السعودي
function calcEosb(hireDate, endDate, reason, basicSalary) {
  if (!hireDate) return { years: 0, fullBenefit: 0, finalBenefit: 0, error: 'تاريخ التعيين غير مسجّل لهذا الموظف — لازم تعدّل بياناته أول' };
  const years = Math.max((new Date(endDate) - new Date(hireDate)) / (1000*60*60*24*365.25), 0);
  const yearsAt5 = Math.min(years, 5);
  const yearsBeyond5 = Math.max(years - 5, 0);
  const fullBenefit = (yearsAt5 * 0.5 * basicSalary) + (yearsBeyond5 * 1 * basicSalary);
  let finalBenefit;
  if (reason === 'استقالة') {
    if (years < 2) finalBenefit = 0;
    else if (years < 5) finalBenefit = fullBenefit / 3;
    else if (years < 10) finalBenefit = fullBenefit * 2/3;
    else finalBenefit = fullBenefit;
  } else {
    finalBenefit = fullBenefit;
  }
  return { years, fullBenefit, finalBenefit: Math.round(finalBenefit*100)/100 };
}

// الحساب المقابل (مجمع الإهلاك) الصحيح حسب فئة الأصل
function accumDepreciationAccount(category) {
  if (category === 'سيارات') return '120202';
  if (category === 'أجهزة حاسب') return '120203';
  return '120201'; // أثاث ومعدات (افتراضي)
}
// يحسب قيمة الإهلاك المستحقة لأصل معيّن لحد تاريخ معيّن (بطريقة القسط الثابت الشهري)
function calcAssetDepreciationDue(asset, asOfDate) {
  const cost = Number(asset.cost) || 0;
  const salvage = Number(asset.salvage_value) || 0;
  const years = Number(asset.useful_life_years) || 1;
  const depreciableBase = Math.max(cost - salvage, 0);
  const monthlyDep = depreciableBase / (years * 12);
  const fromDate = new Date(asset.last_depreciation_date || asset.purchase_date);
  const toDate = new Date(asOfDate);
  const monthsPassed = Math.max(0, (toDate.getFullYear()-fromDate.getFullYear())*12 + (toDate.getMonth()-fromDate.getMonth()));
  const remainingDepreciable = Math.max(depreciableBase - (Number(asset.accumulated_depreciation)||0), 0);
  const due = Math.min(monthlyDep * monthsPassed, remainingDepreciable);
  return { monthlyDep, monthsPassed, due: Math.round(due*100)/100, remainingDepreciable };
}
// يرحّل إهلاك أصل واحد كقيد محاسبي، ويحدّث سجل الأصل
async function postAssetDepreciation(asset, asOfDate) {
  const { due } = calcAssetDepreciationDue(asset, asOfDate);
  if (due <= 0) return { skipped: true, asset };
  const entry = await postJournalEntry(asOfDate, `إهلاك شهري - ${asset.name}`, 'fixed_asset', asset.id, [
    { account_code: '5401', debit: due, credit: 0, description: `إهلاك ${asset.name}` },
    { account_code: accumDepreciationAccount(asset.category), debit: 0, credit: due, description: `مجمع إهلاك ${asset.name}` },
  ]);
  if (!entry) return { failed: true, asset };
  const { error: assetUpdateErr } = await sb.from('fixed_assets').update({ accumulated_depreciation: Number(asset.accumulated_depreciation||0) + due, last_depreciation_date: asOfDate }).eq('id', asset.id);
  if (assetUpdateErr) { console.error('فشل تحديث سجل الأصل بعد ترحيل الإهلاك', asset.id, assetUpdateErr); return { failed: true, asset, journalPostedButAssetNotUpdated: true }; }
  return { posted: true, asset, amount: due };
}

    byAccount[l.account_code].push({ date: l.journal_entries.entry_date, entryNumber: l.journal_entries.entry_number, desc: l.description || l.journal_entries.description, debit: Number(l.debit||0), credit: Number(l.credit||0) });
  });
  state.generalLedgerData = state.chartOfAccounts.filter(a => a.is_posting_account && byAccount[a.code]).map(a => {
    const lines = byAccount[a.code].sort((x,y) => (x.date||'').localeCompare(y.date||''));
    const isDebitNormal = (a.account_type === 'asset' || a.account_type === 'expense');
    let running = 0;
    const withBalance = lines.map(l => {
      running += isDebitNormal ? (l.debit - l.credit) : (l.credit - l.debit);
      return { ...l, balance: running };
    });
    const totalDebit = lines.reduce((s,l) => s + l.debit, 0);
    const totalCredit = lines.reduce((s,l) => s + l.credit, 0);
    return { code: a.code, name: a.name, account_type: a.account_type, lines: withBalance, totalDebit, totalCredit, finalBalance: running };
  });
}

async function postJournalEntry(entryDate, description, sourceType, sourceId, lines, voucherNumber) {
  lines = lines.filter(l => Math.abs(l.debit||0) > 0.001 || Math.abs(l.credit||0) > 0.001); // إسقاط أي سطر بقيمة صفر
  if (lines.length === 0) return null;
  // حماية الفترة المقفلة: لا يُسمح بأي قيد جديد بتاريخ يساوي أو يسبق آخر إقفال سنوي (إلا قيد الإقفال نفسه)
  if (sourceType !== 'closing') {
    const { data: latestClosing } = await sb.from('fiscal_closings').select('closing_date').order('closing_date', { ascending: false }).limit(1).maybeSingle();
    if (latestClosing && entryDate <= latestClosing.closing_date) {
      showToast(`لا يمكن ترحيل قيد بتاريخ ${entryDate} — هذي الفترة مقفلة (آخر إقفال بتاريخ ${latestClosing.closing_date})`, 'error');
      return null;
    }
  }
  const totalDebit = lines.reduce((s,l) => s + (l.debit||0), 0);
  const totalCredit = lines.reduce((s,l) => s + (l.credit||0), 0);
  if (Math.abs(totalDebit - totalCredit) > 0.01) {
    console.error('قيد غير متوازن، تم تجاهله', { totalDebit, totalCredit, lines });
    return null;
  }
  const { data: lastEntries } = await sb.from('journal_entries').select('entry_number').order('created_at', { ascending: false }).limit(50);
  const maxNum = (lastEntries||[]).reduce((max,e) => { const m=(e.entry_number||'').match(/-(\d+)$/); return m?Math.max(max,parseInt(m[1],10)):max; }, 0);
  const entryNumber = `JE-${String(maxNum+1).padStart(5,'0')}`;
  const { data: entry, error } = await sb.from('journal_entries').insert({
    entry_number: entryNumber, voucher_number: voucherNumber||null, entry_date: entryDate, description, source_type: sourceType, source_id: sourceId,
    total_debit: totalDebit, total_credit: totalCredit, created_by: state.session?.user?.id,
  }).select().single();
  if (error || !entry) { console.error('فشل ترحيل القيد', error); showToast('فشل ترحيل القيد المحاسبي — العملية توقفت، لا شي انحفظ', 'error'); return null; }
  const { error: linesErr } = await sb.from('journal_entry_lines').insert(lines.map(l => ({ entry_id: entry.id, account_code: l.account_code, debit: l.debit||0, credit: l.credit||0, description: l.description||null })));
  if (linesErr) {
    // فشل حفظ تفاصيل القيد بعد نجاح الرأس — نتراجع فوراً عشان ما يضل قيد "شبح" بدون تفاصيل يفسد الموازين
    console.error('فشل حفظ تفاصيل القيد، جاري التراجع', linesErr);
    await sb.from('journal_entries').delete().eq('id', entry.id);
    showToast('فشل حفظ تفاصيل القيد المحاسبي — تم التراجع عن العملية بالكامل', 'error');
    return null;
  }
  return entry;
}

}

function showToast(message, type) {
  type = type || (/خطأ|فشل|غير صحيح|غير كافي|أكبر من|اختر|أدخل|اكتب/.test(message) ? 'error' : 'success');
  const colors = {
    success: { bg: '#0F6E56', icon: 'ti-circle-check' },
    error: { bg: '#A32D2D', icon: 'ti-alert-circle' },
  };
  const c = colors[type] || colors.success;
  const el = document.createElement('div');
  el.style.cssText = `background:${c.bg};color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,0.25);pointer-events:auto;max-width:360px;opacity:0;transform:translateY(10px);transition:opacity 0.25s,transform 0.25s;`;
  el.innerHTML = `<i class="ti ${c.icon}" style="font-size:18px;flex-shrink:0;"></i><span>${message}</span>`;
  document.getElementById('toast-container').appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
  setTimeout(() => {
    el.style.opacity = '0'; el.style.transform = 'translateY(10px)';
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

function openItemById(id) {
  const item = state.items.find(it => it.id === id);
  if (!item) return;
  const toStr = v => (v === null || v === undefined) ? '' : String(v);
  state.form = {
    ...emptyForm(), ...item,
    cost: toStr(item.cost), price: toStr(item.price), price2: toStr(item.price2), price3: toStr(item.price3),
    discount_percent: toStr(item.discount_percent), opening_cost: toStr(item.opening_cost), foreign_cost: toStr(item.foreign_cost),
    last_cost: toStr(item.last_cost), book_cost: toStr(item.book_cost),
    competitor1_price: toStr(item.competitor1_price), competitor2_price: toStr(item.competitor2_price), competitor3_price: toStr(item.competitor3_price),
    qty: toStr(item.qty), reorder_at: toStr(item.reorder_at), max_limit: toStr(item.max_limit),
  };
  state.formErrors = {};
  state.editingId = item.id;
  state.activeTab = 'عام';
  state.itemLastPurchasePrices = [];
  loadLastPurchasePrices(item.id, 3).then(prices => { state.itemLastPurchasePrices = prices; if (state.activeTab === 'الاسعار') render(); });
  state.showForm = true;
  render();
}

function openPartyById(id) {
  const p = state.parties.find(x => x.id === id);
  if (!p) return;
  state.partyForm = { ...emptyPartyForm(), ...p, balance: String(p.balance ?? '0'), opening_balance: String(p.opening_balance ?? '0'),
    last_transaction_date: p.last_transaction_date || '', opening_balance_date: p.opening_balance_date || '' };
  state.partyFormErrors = {};
  state.editingPartyId = p.id;
  state.partyActiveTab = 'معلومات عامة';
  state.showPartyForm = true;
  render();
}

function bindAppEvents() {
  document.querySelectorAll('[data-open-item-picker]').forEach(btn => {
    btn.onclick = () => { openItemPicker(JSON.parse(btn.dataset.openItemPicker)); };
  });
  document.querySelectorAll('[data-open-party-picker]').forEach(btn => {
    btn.onclick = () => {
      state.partyPickerContext = JSON.parse(btn.dataset.openPartyPicker);
      state.partyPickerQuery = '';
