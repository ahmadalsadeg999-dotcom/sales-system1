      render();
    };
  });
  if (state.showPartyPicker) {
    document.getElementById('pk-close').onclick = () => { state.showPartyPicker = false; render(); };
    document.getElementById('pk-search').oninput = (ev) => {
      state.partyPickerQuery = ev.target.value;
      const pos = ev.target.selectionStart;
      render();
      const el = document.getElementById('pk-search');
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    };
    document.querySelectorAll('[data-pick-party]').forEach(row => {
      row.onclick = () => {
        const ctx = state.partyPickerContext || {};
        const input = document.getElementById(ctx.inputId);
        if (input) {
          input.value = row.dataset.pickParty;
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }
        state.showPartyPicker = false;
        render();
      };
    });
  }
  if (state.itemPickerOpen) {
    const ctx = state.itemPickerContext || {};
    const closeIpk = () => { state.itemPickerOpen = false; render(); };
    document.getElementById('ipk-close').onclick = closeIpk;
    document.getElementById('ipk-reset-columns').onclick = () => {
      saveItemPickerColumns(ITEM_PICKER_COLUMNS_DEFAULT.map(c => ({...c})));
      render();
    };
    // إعادة ترتيب الأعمدة بالسحب والإفلات
    let dragColIdx = null;
    document.querySelectorAll('[data-col-header]').forEach(header => {
      header.ondragstart = (ev) => {
        dragColIdx = parseInt(header.dataset.colHeader, 10);
        ev.dataTransfer.effectAllowed = 'move';
      };
      header.ondragover = (ev) => { ev.preventDefault(); };
      header.ondrop = (ev) => {
        ev.preventDefault();
        const dropIdx = parseInt(header.dataset.colHeader, 10);
        if (dragColIdx === null || dragColIdx === dropIdx) return;
        const columns = getItemPickerColumns();
        const [moved] = columns.splice(dragColIdx, 1);
        columns.splice(dropIdx, 0, moved);
        saveItemPickerColumns(columns);
        dragColIdx = null;
        render();
      };
    });
    // تغيير عرض الأعمدة بالسحب من حافة العمود
    document.querySelectorAll('[data-col-resize]').forEach(handle => {
      handle.onmousedown = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const idx = parseInt(handle.dataset.colResize, 10);
        const columns = getItemPickerColumns();
        const startX = ev.clientX;
        const startWidth = columns[idx].width;
        const onMove = (moveEv) => {
          // بالعربي (RTL) السحب لليسار يكبّر العمود
          const delta = startX - moveEv.clientX;
          const newWidth = Math.max(45, startWidth + delta);
          columns[idx].width = newWidth;
          const gridTemplate = columns.map(c => c.width+'px').join(' ');
          document.querySelectorAll('#ipk-header-row, [data-pick-item]').forEach(rowEl => { rowEl.style.gridTemplateColumns = gridTemplate; });
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          saveItemPickerColumns(columns);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };
    });
    const searchEl = document.getElementById('ipk-search');
    searchEl.oninput = (ev) => {
      state.itemPickerQuery = ev.target.value;
      const pos = ev.target.selectionStart;
      render();
      const el = document.getElementById('ipk-search');
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    };
    document.querySelectorAll('[data-pick-item]').forEach(row => {
      row.onclick = async () => {
        state.itemPickerSelectedId = row.dataset.pickItem;
        const ctx2 = state.itemPickerContext || {};
        if (ctx2.priceKey === 'price') {
          state.itemPickerPriceHistory = [];
          state.itemPickerPriceHistoryItemId = row.dataset.pickItem;
          render();
          const { data } = await sb.from('sales_invoice_items').select('unit_price, sales_invoices!inner(invoice_date, invoice_number, approved)').eq('item_id', row.dataset.pickItem).eq('sales_invoices.approved', true).order('sales_invoices(invoice_date)', { ascending: false }).limit(5);
          if (state.itemPickerPriceHistoryItemId === row.dataset.pickItem) {
            state.itemPickerPriceHistory = (data||[]).map(r => ({ price: Number(r.unit_price), date: r.sales_invoices?.invoice_date, invoice_number: r.sales_invoices?.invoice_number }));
            render();
          }
        } else {
          render();
        }
        const qtyEl = document.getElementById('ipk-qty');
        if (qtyEl) { qtyEl.focus(); qtyEl.select(); }
      };
    });
    const confirmFinal = () => {
      const targetSelect = document.getElementById(ctx.targetSelectId);
      if (targetSelect) {
        targetSelect.value = state.itemPickerSelectedId;
        targetSelect.dispatchEvent(new Event('change', { bubbles: true }));
      }
      if (ctx.qtyId) {
        const qtyEl = document.getElementById(ctx.qtyId);
        const pickedQty = document.getElementById('ipk-qty');
        if (qtyEl && pickedQty) qtyEl.value = pickedQty.value;
      }
      if (ctx.priceId) {
        const priceEl = document.getElementById(ctx.priceId);
        const pickedPrice = document.getElementById('ipk-price');
        if (priceEl && pickedPrice) priceEl.value = pickedPrice.value;
      }
      state.itemPickerOpen = false;
      if (ctx.addBtnId) {
        const addBtn = document.getElementById(ctx.addBtnId);
        if (addBtn) { addBtn.click(); return; }
      }
      render();
    };
    if (document.getElementById('ipk-confirm-add')) {
      document.getElementById('ipk-confirm-add').onclick = confirmFinal;
    }
    ['ipk-qty','ipk-price'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onkeydown = (ev) => { if (ev.key === 'Enter') confirmFinal(); };
    });
  }
  document.querySelectorAll('[data-dropdown]').forEach(btn => {
    btn.onclick = (ev) => {

            if (!confirm(`المبلغ المدفوع (${fmt(f.paid_amount)}) أكبر من إجمالي الفاتورة (${fmt(t0.grandTotal)}) — تأكد إنك ما كتبت رقم غلط. متابعة؟`)) return;
          }
          if (!confirm('اعتماد الفاتورة يزيد المخزون تلقائياً ويربط رصيد المورد لو آجل، ولا يمكن التراجع عنه من هنا. متابعة؟')) return;
          const t = calcPurchaseTotals(f);
          const saveWarnings = [];
          const trackedCall = async (promise, label) => { const { error } = await promise; if (error) saveWarnings.push(`${label}: ${error.message}`); };
          for (const l of f.lines) {
            const item = state.items.find(it => it.id === l.item_id);
            const oldQty = Number(item.qty) || 0;
            const oldCost = Number(item.cost) || 0;
            const unitCostSAR = l.unit_cost * t.rate; // نحوّل تكلفة السطر لريال سعودي لو الفاتورة بعملة أجنبية (المخزون والتقارير كلها بالريال دايماً)
            // المتوسط المرجّح: التكلفة الجديدة = (الكمية القديمة × تكلفتها + الكمية المشتراة × تكلفتها بالريال) ÷ إجمالي الكمية
            const newQtyTotal = oldQty + l.quantity;
            const weightedAvgCost = newQtyTotal > 0 ? ((oldQty * oldCost) + (l.quantity * unitCostSAR)) / newQtyTotal : unitCostSAR;
            await trackedCall(sb.from('items').update({ qty: newQtyTotal, cost: weightedAvgCost, last_cost: unitCostSAR }).eq('id', l.item_id), `تحديث رصيد صنف ${item.sku||l.item_id}`);
            if (f.warehouse_id) await adjustWarehouseStock(l.item_id, f.warehouse_id, l.quantity);
          }
          if (f.invoice_type === 'آجل') {
            const supplier = state.parties.find(p => p.id === f.supplier_id);
            if (supplier) {
              await trackedCall(sb.from('parties').update({ balance: Number(supplier.balance || 0) + t.dueSAR }).eq('id', supplier.id), 'تحديث رصيد المورد');
              await loadParties();
            }
          } else if (t.due !== 0) {
            // فاتورة نقدي بمبلغ غير مدفوع بالكامل — نسجّله كدين على المورد لو مسجّل، وإلا ننبّه إنه غير محفوظ
            if (f.supplier_id) {
              const supplier = state.parties.find(p => p.id === f.supplier_id);
              if (supplier) {
                await trackedCall(sb.from('parties').update({ balance: Number(supplier.balance || 0) + t.dueSAR }).eq('id', supplier.id), 'تحديث رصيد المورد');
                await loadParties();
              }
            } else if (t.due > 0) {
              showToast(`تنبيه: يوجد مبلغ غير مدفوع ${fmt(t.due)} لمورد غير مسجّل — لن يُحفظ كدين قابل للمتابعة`, 'error');
            }
          }
          await trackedCall(sb.from('purchase_invoices').update({ approved: true }).eq('id', state.editingPurchaseId), 'اعتماد الفاتورة نفسها');
          if (saveWarnings.length > 0) alert('⚠️ تحذير: بعض التحديثات فشلت أثناء الاعتماد، راجعها يدوياً:\n\n' + saveWarnings.join('\n'));
          state.purchaseForm.approved = true;
          logActivity('اعتماد فاتورة شراء', f.invoice_number);
          // القيد المحاسبي: مدين المخزون + ضريبة مدخلات — دائن الموردون (آجل) أو الصندوق/البنك (نقدي)
          {
            const jLines = [
              { account_code:'1103', debit: t.subtotalSAR - t.discount*t.rate, credit:0, description:'مخزون - '+f.invoice_number },
              { account_code:'1104', debit: t.taxTotalSAR, credit:0, description:'ضريبة مدخلات' },
            ];
            if (f.invoice_type === 'آجل') {

              if (t.due > 0) jLines.push({ account_code: getPartyAccountCode(f.supplier_id,'supplier'), debit:0, credit: t.dueSAR, description:'باقي غير مدفوع' });
            }
            const jEntry1 = await postJournalEntry(f.invoice_date, `فاتورة شراء ${f.invoice_number}`, 'purchase_invoice', state.editingPurchaseId, jLines);
            if (!jEntry1) showToast('⚠️ تم الاعتماد لكن فشل ترحيل القيد المحاسبي — راجع الحساب يدوياً', 'error');
          }
          await loadDocJournalNumbers('purchase_invoice', state.editingPurchaseId);
          await loadItems();
          await loadPurchases();
          showToast('تم اعتماد الفاتورة بنجاح');

        };

        const knownCodes = new Set(state.chartOfAccounts.filter(a=>a.is_posting_account).map(a=>a.code));

        const jLines = validLines.map(l => ({ account_code:l.account_code, debit:Number(l.debit)||0, credit:Number(l.credit)||0, description: l.description||null }));
        const entry = await postJournalEntry(f.entry_date, f.description, 'manual', null, jLines, f.voucher_number);

// ---------- النسخ الاحتياطي ----------
// نفس قائمة الجداول المستخدمة بزر "تحميل نسخة احتياطية تامة" اليدوي — نعيد استخدامها للنسخة التلقائية
const BACKUP_TABLE_ORDER = [
  'warehouses','payment_methods','chart_of_accounts','company_settings',
  'items','parties','item_warehouse_stock',
  'quotations','quotation_items',
  'purchase_invoices','purchase_invoice_items',
  'sales_invoices','sales_invoice_items',
  'sales_returns','sales_return_items',
  'purchase_returns','purchase_return_items',
  'stock_counts','stock_count_items',
  'warehouse_transfers','warehouse_transfer_items',
  'receipt_vouchers','payment_vouchers',
  'journal_entries','journal_entry_lines',
  'employees','payroll_records','employee_leaves','eosb_settlements','fixed_assets',
];
async function buildBackupObject() {
  const tables = {};
  for (const t of BACKUP_TABLE_ORDER) {
    try { const { data } = await sb.from(t).select('*'); tables[t] = data || []; }
    catch(e) { tables[t] = []; }
  }
  return { system: 'نظام المبيعات والمخزون المتكامل', format_version: 1, exported_at: new Date().toISOString(), tables };
}
// نسخة احتياطية تلقائية: تبني الملف وترفعه لمكان تخزين Supabase (بدون تنزيل، بدون تدخل المستخدم)
async function runAutoBackupToStorage() {
  const backupObj = await buildBackupObject();
  const filename = `backup-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  const blob = new Blob([JSON.stringify(backupObj)], { type: 'application/json' });
  const { error } = await sb.storage.from('backups').upload(filename, blob, { upsert: true });
  if (error) return { success: false, error: error.message };
  await sb.from('backup_settings').update({ last_backup_at: new Date().toISOString(), last_backup_path: filename }).eq('id', 1);
  return { success: true, filename };
}
async function checkAndRunAutoBackup() {
  try {
    const { data: settings } = await sb.from('backup_settings').select('*').eq('id', 1).maybeSingle();
    if (!settings) return;
    state.backupSettings = settings;
    const daysSinceLastBackup = settings.last_backup_at ? (new Date() - new Date(settings.last_backup_at)) / 86400000 : Infinity;
    if (daysSinceLastBackup >= settings.frequency_days) {
      const result = await runAutoBackupToStorage();
      if (result.success) {
        const { data: fresh } = await sb.from('backup_settings').select('*').eq('id', 1).maybeSingle();
        state.backupSettings = fresh;
      }
    }
  } catch(e) { /* لو فشل الفحص لأي سبب (مثلاً الجدول غير موجود بعد)، نكمل عادي بدون ما نوقف النظام */ }
}

async function calcExpectedCashToday() {
  const today = new Date().toISOString().slice(0,10);
  let expected = 0;
  const { data: sales } = await sb.from('sales_invoices').select('paid_amount').eq('approved', true).eq('invoice_type', 'نقدي').eq('invoice_date', today);
  (sales||[]).forEach(r => { expected += Number(r.paid_amount||0); });
  const { data: purch } = await sb.from('purchase_invoices').select('paid_amount').eq('approved', true).eq('invoice_type', 'نقدي').eq('invoice_date', today);
  (purch||[]).forEach(r => { expected -= Number(r.paid_amount||0); });
  const { data: sret } = await sb.from('sales_returns').select('total').eq('approved', true).eq('payment_method', 'نقدي').eq('return_date', today);
  (sret||[]).forEach(r => { expected -= Number(r.total||0); });
  const { data: pret } = await sb.from('purchase_returns').select('total').eq('approved', true).eq('payment_method', 'نقدي').eq('return_date', today);
  (pret||[]).forEach(r => { expected += Number(r.total||0); });
  const { data: rec } = await sb.from('receipt_vouchers').select('amount').eq('approved', true).eq('payment_method', 'نقدي').eq('voucher_date', today);
  (rec||[]).forEach(r => { expected += Number(r.amount||0); });
  const { data: pay } = await sb.from('payment_vouchers').select('amount').eq('approved', true).eq('payment_method', 'نقدي').eq('voucher_date', today);
  (pay||[]).forEach(r => { expected -= Number(r.amount||0); });
  const { data: cd } = await sb.from('cash_disbursement_vouchers').select('amount, payment_method').eq('approved', true).eq('voucher_date', today);
  (cd||[]).forEach(r => { if (r.payment_method==='نقدي') expected -= Number(r.amount||0); });
  return expected;
}

async function runQuickOpen(typeLabel, number) {
  const cfg = quickOpenConfig().find(c => c.label === typeLabel);
  if (!cfg) return { success:false, message:'نوع مستند غير معروف' };
  await cfg.loadFn();
  const found = state[cfg.listKey].find(x => (x[cfg.numberField]||'').trim() === number.trim());
  if (!found) return { success:false, message:`ما لقيت ${typeLabel} برقم "${number}"` };
  state.activeSection = cfg.activeSection;
  state.showQuickOpen = false;
  await cfg.openFn(found.id);
  return { success:true };
}

async function loadOpeningInvDocs() {
  const { data } = await sb.from('opening_inventory_docs').select('*').order('created_at', { ascending: false });
  state.openingInvDocs = data || [];
}
function calcOpeningInvTotal(f) {
  return f.lines.reduce((s,l) => s + Number(l.quantity||0) * Number(l.cost||0), 0);
}
async function openOpeningInvById(id) {
  const doc = state.openingInvDocs.find(d => d.id === id);
  if (!doc) return;
  const { data: items } = await sb.from('opening_inventory_items').select('*, items(sku, name, unit)').eq('doc_id', id);
  state.openingInvForm = {
    doc_number: doc.doc_number, doc_date: doc.doc_date, warehouse_id: doc.warehouse_id, notes: doc.notes||'', approved: doc.approved,
    lines: (items||[]).map(l => ({ item_id: l.item_id, sku: l.items?.sku, item_name: l.items?.name, unit: l.items?.unit, quantity: l.quantity, cost: l.cost })),
  };
  state.editingOpeningInvId = id;
  state.showOpeningInvForm = true;
  render();
}

// ---------- فتح حساب فرعي تلقائي بشجرة الحسابات لكل عميل/مورد آجل، وربطه بحركاته ----------
async function ensurePartyAccount(partyId, partyType) {
  const party = state.parties.find(p => p.id === partyId);
  if (party?.account_code) return party.account_code; // موجود أصلاً، ما نكرر
  const parentCode = partyType === 'customer' ? '110201' : '210101';
  const { data: existing } = await sb.from('chart_of_accounts').select('code').like('code', parentCode + '%').neq('code', parentCode);
  const maxNum = (existing||[]).reduce((max, a) => { const suffix = a.code.slice(parentCode.length); const n = parseInt(suffix,10); return isNaN(n)?max:Math.max(max,n); }, 0);
  const newCode = parentCode + String(maxNum+1).padStart(3,'0');
  const partyName = party ? party.name : '';
  const { error: coaErr } = await sb.from('chart_of_accounts').insert({ code:newCode, parent_code:parentCode, name: partyName, account_type: partyType==='customer'?'asset':'liability', level:'3', is_posting_account:true, active:true });
  if (coaErr) { console.error('فشل فتح حساب فرعي للعميل/المورد', coaErr); return null; }
  const { error: linkErr } = await sb.from('parties').update({ account_code: newCode }).eq('id', partyId);
  if (linkErr) console.error('فشل ربط الحساب بالعميل/المورد', linkErr);
  return newCode;
}
// يرجّع الحساب اللي يترحّل عليه القيد لعميل/مورد معيّن — حسابه الخاص لو موجود، وإلا الحساب المجمّع الافتراضي
function getPartyAccountCode(partyId, partyType) {
  const controlAccount = partyType === 'customer' ? '110201' : '210101';
  if (!partyId) return controlAccount;
  const party = state.parties.find(p => p.id === partyId);
  return party?.account_code || controlAccount;
}

async function init() {
  try {
    const { data: license } = await sb.from('license_settings').select('*').eq('id', 1).maybeSingle();
    if (license) {
      state.licenseExpiryDate = license.expiry_date;
      state.licenseContact = license.designer_contact || '';
      const today = new Date().toISOString().slice(0,10);
      if (today > license.expiry_date) {
        state.licenseExpired = true;
        render();
        return; // نوقف هنا كلياً — ما نكمل تحميل أي شي، حتى شاشة الدخول
      }
      const daysLeft = Math.ceil((new Date(license.expiry_date) - new Date(today)) / 86400000);
      if (daysLeft <= 7) state.licenseWarningDays = daysLeft;
    }
  } catch (e) { /* لو فشل الفحص لأي سبب (مثلاً الجدول غير موجود بعد)، نكمل عادي بدون ما نوقف النظام */ }
  await loadCompany();
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) { await loadProfile(); await loadItems(); await loadParties(); await loadPurchases(); await loadSalesInvoices(); await loadWarehouses(); await loadPaymentMethods(); state.homeCogs = await calcHomeNetProfit(); }
  render();
  if (state.session) checkAndRunAutoBackup(); // فحص النسخة الاحتياطية بالخلفية، بدون ما يأخّر ظهور الشاشة
}
sb.auth.onAuthStateChange((event, session) => {
  state.session = session;
});
init();
</script>
